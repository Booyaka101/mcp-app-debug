name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch. A second push supersedes the first instead of queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The suite drives a real browser once per scenario; profile cases run the
    # scan twice (spec baseline + named profile) and --profile all runs it five
    # times, so it needs more headroom than the 7-check era.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Pack and smoke-test the tarball
        shell: bash
        run: |
          npm pack
          node test/broken-server.mjs ok 3123 &
          sleep 3
          npx -y ./mcp-app-debug-*.tgz http://localhost:3123/mcp --json
      - name: Smoke-test profiles from the packed tarball
        shell: bash
        run: |
          # Proves the descriptors ship in the tarball and resolve from
          # dist/, not just from the source tree.
          node test/profile-server.mjs weather 3124 &
          sleep 3
          npx -y ./mcp-app-debug-*.tgz http://localhost:3124/mcp --profile grok --json --timeout 14 > profiles.json
          node -e "
            const r = JSON.parse(require('fs').readFileSync('profiles.json', 'utf8').replace(/^﻿/, ''));
            const row = r.matrix.checks.indexOf('tool-result-redelivery');
            if (r.matrix.checks.length !== 10) throw new Error('expected 10 rows, got ' + r.matrix.checks.length);
            if (r.verdict !== 'APP-OK-HOST-SUSPECT') throw new Error('expected APP-OK-HOST-SUSPECT, got ' + r.verdict);
            if (r.matrix.cells[row].join() !== 'PASS,FAIL') throw new Error('expected check 8 PASS,FAIL got ' + r.matrix.cells[row].join());
            console.log('tarball profile smoke test OK:', r.verdict);
          "
      - name: Smoke-test aggregator mode from the packed tarball
        shell: bash
        run: |
          # ext-apps#745 from the published bundle: an app that hardcodes its
          # tool name must fail check 11 and exit 1 behind the gateway.
          node test/profile-server.mjs bare-names 3125 &
          sleep 3
          set +e
          npx -y ./mcp-app-debug-*.tgz http://localhost:3125/mcp --aggregator --json --timeout 12 > aggregator.json
          code=$?
          set -e
          node -e "
            const r = JSON.parse(require('fs').readFileSync('aggregator.json', 'utf8').replace(/^﻿/, ''));
            const c = r.checks.find((x) => x.id === 'aggregator-safe-tool-names');
            if (!c) throw new Error('no aggregator check in the report');
            if (c.pass) throw new Error('expected check 11 to FAIL, got: ' + c.detail);
            if (r.tool !== 'alpha__forecast') throw new Error('expected the rewritten tool name, got ' + r.tool);
            if ($code !== 1) throw new Error('expected exit 1, got $code');
            console.log('tarball aggregator smoke test OK:', c.detail);
          "
