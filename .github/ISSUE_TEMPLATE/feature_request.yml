name: Feature request
description: Suggest something mcp-app-debug should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Connects to an MCP server you point it at and renders its app locally. Headers you pass are sent to that server and nowhere else.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. What got in your way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
    validations:
      required: false
