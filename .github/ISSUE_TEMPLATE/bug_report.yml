name: Bug report
description: Something didn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **never paste bearer tokens or `Authorization` headers** — check any command output you copy in here for them first.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, and what came back.
      placeholder: |
        $ npx mcp-app-debug http://localhost:3001/mcp
        Error: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: mcp-app-debug version
      description: Output of `npx mcp-app-debug --version`
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Node version and OS
      description: Output of `node --version`, plus your OS.
      placeholder: v22.18.0 on macOS 15
    validations:
      required: true

  - type: textarea
    id: fixture
    attributes:
      label: Does `npx mcp-app-debug host` reproduce it?
      description: The built-in fixture server takes your own server out of the picture. If the fixture works and yours does not, say what differs.
